name: Check

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

jobs:
  check:
    name: Check (${{ matrix.os }})
    # The app is packaged for the platform it is built on, so each platform builds on its own runner.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            electron-cache: ~/.cache/electron
          - os: windows-latest
            electron-cache: ~/AppData/Local/electron/Cache
          - os: macos-latest
            electron-cache: ~/Library/Caches/electron
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: "25"
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v6
      - name: Cache Node.js download
        uses: actions/cache@v6
        with:
          path: ~/.gradle/electron-jvm/node
          key: node-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gradle/libs.versions.toml') }}
      - name: Cache Electron download
        uses: actions/cache@v6
        with:
          path: ${{ matrix.electron-cache }}
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gradle/libs.versions.toml') }}
      - name: Cache node_modules
        uses: actions/cache@v6
        with:
          path: samples/sample/web/node_modules
          key: npm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('samples/sample/web/package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-${{ runner.arch }}-
      - name: check
        run: ./gradlew check
      - name: assembleDesktop
        # jdeps and jlink on the sample's sidecars: the shared runtime and the desktop folder the app ships.
        run: ./gradlew :samples:shell:assembleDesktop
      - name: package
        # Installs the default Electron and @electron/packager and packages the sample with them, so a version bump
        # (Renovate's included) is tested before it merges.
        run: ./gradlew :samples:shell:package
      - name: Archive package
        # tar keeps the executable bits and the macOS bundle's symlinks, which upload-artifact drops.
        run: tar -czf sample-package.tar.gz -C samples/shell/build/package .
      - uses: actions/upload-artifact@v6
        with:
          name: sample-${{ runner.os }}-${{ runner.arch }}
          path: sample-package.tar.gz
          retention-days: 14
