[versions]
electron = "0.1.0-SNAPSHOT"
kotlin = "2.4.21"
ktor = "3.6.0"
kotlinxSerialization = "1.11.0"
logback = "1.6.5"
htmx = "2.0.11"
nodeGradle = "7.1.0"
# Defaults of electronShell { } and electronSidecar { }, kept current by Renovate (renovate.json) on main and shipped
# with whatever release comes next. Node.js only builds; Electron is what apps ship, and apps should pin their own.
# renovate: datasource=node-version depName=node
nodejs = "24.22.0"
# renovate: datasource=npm depName=electron
electronApp = "44.7.2"
# renovate: datasource=npm depName=@electron/packager
electronPackager = "20.3.0"

[libraries]
ktor-server-core = { module = "io.ktor:ktor-server-core", version.ref = "ktor" }
ktor-server-cio = { module = "io.ktor:ktor-server-cio", version.ref = "ktor" }
ktor-server-sse = { module = "io.ktor:ktor-server-sse", version.ref = "ktor" }
ktor-server-auth = { module = "io.ktor:ktor-server-auth", version.ref = "ktor" }
ktor-server-status-pages = { module = "io.ktor:ktor-server-status-pages", version.ref = "ktor" }
ktor-server-html-builder = { module = "io.ktor:ktor-server-html-builder", version.ref = "ktor" }
ktor-server-test-host = { module = "io.ktor:ktor-server-test-host", version.ref = "ktor" }
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-cio = { module = "io.ktor:ktor-client-cio", version.ref = "ktor" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
htmx = { module = "org.webjars.npm:htmx.org", version.ref = "htmx" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
node-gradle = { id = "com.github.node-gradle.node", version.ref = "nodeGradle" }
